name: Build native Windows app
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      app_url:
        description: Optional default coordination HTTPS origin (editable in the app)
        required: false
        type: string
      publish_release:
        description: Publish a GitHub preview release after all checks pass
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    env:
      HUSH_SERVER_URL: ${{ inputs.app_url }}
      OPUS_STATIC: '1'
      CMAKE_POLICY_VERSION_MINIMUM: '3.5'
    steps:
      - uses: actions/checkout@v4
      - name: Validate release tag
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          if ($env:GITHUB_REF -like 'refs/tags/*' -and $env:GITHUB_REF_NAME -ne "v$version") { throw 'The Git tag must match the package version' }
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm ci --prefix setup
      - run: npm run cloudflare:build
      - run: npm run build
      - name: Validate terminal setup without cloud writes
        shell: pwsh
        run: |
          node setup/setup.mjs --dry-run --state-dir "$env:RUNNER_TEMP/hush setup validation"
          if ($LASTEXITCODE -ne 0) { throw 'Terminal setup dry run failed' }
          $env:HUSH_SETUP_HOME = "$env:RUNNER_TEMP/hush bootstrap tools"
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/setup-server.ps1 -UseLocalNode -BootstrapOnly
          if ($LASTEXITCODE -ne 0) { throw 'Windows host runtime bootstrap failed' }
          $oldRelease = Start-Process powershell.exe -ArgumentList @('-NoProfile','-ExecutionPolicy','Bypass','-File','scripts/setup-server.ps1','-UseLocalNode','-Release','v0.4.1','-DryRun') -Wait -PassThru -RedirectStandardOutput 'old-release.stdout.log' -RedirectStandardError 'old-release.stderr.log'
          if ($oldRelease.ExitCode -eq 0 -or (Get-Content old-release.stderr.log -Raw) -notmatch 'Missing or ambiguous checksum') { throw 'Binary-served GitHub checksum metadata was not decoded correctly' }
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked -p hush-native --all-targets -- -D warnings
      - run: cargo test --locked -p hush-native
      - run: cargo build --locked --release -p hush-native
      - run: npm test
      - name: Verify no separate Microsoft C runtime is required
        shell: pwsh
        run: |
          $visualStudio = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products '*' -property installationPath
          $dependencyTool = Get-ChildItem "$visualStudio\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $dependencyTool) { throw 'Could not locate the Windows dependency inspection tool' }
          $dependencies = (& $dependencyTool.FullName /DEPENDENTS target/release/hush-native.exe | Out-String)
          Write-Output $dependencies
          if ($dependencies -match 'VCRUNTIME140|MSVCP140') { throw 'The executable still depends on a separate Microsoft C runtime' }
      - name: Test native audio and chat against local coordination
        shell: pwsh
        run: |
          $voiceServer = Start-Process node -ArgumentList '--import','tsx','scripts/dev-server.ts' -PassThru -RedirectStandardOutput 'coordination.stdout.log' -RedirectStandardError 'coordination.stderr.log'
          try {
            $ready = $false
            for ($attempt = 0; $attempt -lt 20; $attempt++) {
              try { Invoke-WebRequest 'http://127.0.0.1:5173/' -UseBasicParsing | Out-Null; $ready = $true; break } catch { Start-Sleep -Seconds 1 }
            }
            if (-not $ready) { throw 'Local coordination did not start' }
            $nativeTest = Start-Process 'target/release/hush-native.exe' -ArgumentList '--self-test' -Wait -PassThru -RedirectStandardOutput 'native-test.stdout.log' -RedirectStandardError 'native-test.stderr.log'
            Get-Content 'native-test.stderr.log'
            if ($nativeTest.ExitCode -ne 0) { throw "Native integration test failed: $($nativeTest.ExitCode)" }
          } finally { Stop-Process -Id $voiceServer.Id -ErrorAction SilentlyContinue }
      - name: Install NSIS packaging tool
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\NSIS\makensis.exe")) { choco install nsis --yes --no-progress }
      - name: Package native installer
        shell: pwsh
        run: '& "${env:ProgramFiles(x86)}\NSIS\makensis.exe" packaging/windows/installer.nsi'
      - name: Verify installer upgrade removes old tools and preserves settings
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $sandbox = Join-Path $env:RUNNER_TEMP 'Hush upgrade sandbox'
          New-Item -ItemType Directory "$sandbox/deployment/node_modules" -Force | Out-Null
          Set-Content "$sandbox/deployment/node.exe" 'old runtime'
          Set-Content "$sandbox/deployment/node_modules/legacy.txt" 'old tools'
          $preferences = "$env:APPDATA/Hush/Hush/config/preferences.json"
          $serverState = "$env:LOCALAPPDATA/Hush/Hush/data/cloudflare/servers.json"
          New-Item -ItemType Directory (Split-Path $preferences), (Split-Path $serverState) -Force | Out-Null
          Set-Content $preferences '{"server":"https://existing.example","name":"Player"}'
          Set-Content $serverState '{"existing-server":"preserve"}'
          $prefsBefore = (Get-FileHash $preferences).Hash
          $stateBefore = (Get-FileHash $serverState).Hash
          $installer = (Resolve-Path "packaging/windows/Hush-$version-Windows-Setup.exe").Path
          $installed = Start-Process $installer -ArgumentList ("/S /D=" + $sandbox) -Wait -PassThru
          if ($installed.ExitCode -ne 0) { throw 'Silent installer failed' }
          if (-not (Test-Path (Join-Path $sandbox 'hush-native.exe'))) {
            Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\Hush' | Format-List
            throw "Installer did not write to the requested path: $sandbox"
          }
          if (Test-Path "$sandbox/deployment") { throw 'Legacy deployment payload remains' }
          if ((Get-FileHash "$sandbox/hush-native.exe").Hash -ne (Get-FileHash target/release/hush-native.exe).Hash) { throw 'Installed executable differs from the build' }
          if ((Get-FileHash $preferences).Hash -ne $prefsBefore -or (Get-FileHash $serverState).Hash -ne $stateBefore) { throw 'Upgrade changed saved settings or server state' }
      - name: Prepare complete release packages
        shell: pwsh
        run: |
          $version = (Get-Content native/Cargo.toml | Select-String '^version = "([^"]+)"$').Matches.Groups[1].Value
          if ((Get-Content package.json | ConvertFrom-Json).version -ne $version) { throw 'Package versions do not match' }
          $packageRoot = New-Item -ItemType Directory -Path portable/Hush -Force
          $releaseRoot = New-Item -ItemType Directory -Path release-assets -Force
          Copy-Item target/release/hush-native.exe, README.md, native/assets/OFL-Manrope.txt $packageRoot
          Compress-Archive -Path portable/Hush -DestinationPath "$releaseRoot/Hush-$version-Windows-Portable.zip"
          Copy-Item "packaging/windows/Hush-$version-Windows-Setup.exe" $releaseRoot
          Copy-Item native/assets/OFL-Manrope.txt $releaseRoot
          git -c core.autocrlf=false -c core.eol=lf archive --format=zip --prefix="Hush-$version-source/" --output="release-assets/Hush-$version-Source.zip" HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Could not package source archive' }
          $serverRoot = New-Item -ItemType Directory -Path server-bundle -Force
          Copy-Item setup/setup.mjs, setup/worker.mjs, setup/package.json, setup/package-lock.json, setup/README.md $serverRoot
          Compress-Archive -Path server-bundle/* -DestinationPath "$releaseRoot/Hush-Server-Setup.zip"
          Copy-Item scripts/setup-server.ps1 $releaseRoot
          $shellLauncher = (Get-Content scripts/setup-server.sh -Raw).Replace("`r`n", "`n")
          [IO.File]::WriteAllText("$releaseRoot/setup-server.sh", $shellLauncher, [Text.UTF8Encoding]::new($false))
          if ((Get-Item "$releaseRoot/Hush-$version-Windows-Setup.exe").Length -gt 12MB -or (Get-Item "$releaseRoot/Hush-$version-Windows-Portable.zip").Length -gt 12MB) { throw 'Desktop download exceeded the 12 MB size budget' }
          Get-ChildItem $releaseRoot -File | Sort-Object Name | ForEach-Object { $digest = Get-FileHash $_.FullName -Algorithm SHA256; "$($digest.Hash.ToLower())  $($_.Name)" } | Set-Content -Encoding ascii "$releaseRoot/SHA256SUMS.txt"
      - name: Validate packaged Windows setup without cloud writes
        shell: pwsh
        run: |
          $env:HUSH_SETUP_HOME = "$env:RUNNER_TEMP/hush bootstrap tools"
          $env:HUSH_SETUP_STATE = "$env:RUNNER_TEMP/hush packaged state"
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File release-assets/setup-server.ps1 -UseLocalNode -BundleDirectory "$pwd/release-assets" -DryRun
          if ($LASTEXITCODE -ne 0) { throw 'Packaged Windows setup did not pass its dry run' }
      - uses: actions/upload-artifact@v4
        with:
          name: Hush-Windows-native
          path: release-assets/*
          if-no-files-found: error
  setup-unix:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Hush-Windows-native
          path: release-assets
      - name: Validate Unix host runtime bootstrap
        run: |
          bash -n release-assets/setup-server.sh
          HUSH_SETUP_HOME="$RUNNER_TEMP/hush bootstrap tools" HUSH_USE_LOCAL_NODE=1 HUSH_SETUP_BUNDLE_DIR="$PWD/release-assets" HUSH_SETUP_STATE="$RUNNER_TEMP/hush packaged state" bash release-assets/setup-server.sh --dry-run
  release:
    if: ${{ inputs.publish_release || startsWith(github.ref, 'refs/tags/v') }}
    needs: [build, setup-unix]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Hush-Windows-native
          path: release-assets
      - name: Verify and publish preview
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          (cd release-assets && sha256sum --check SHA256SUMS.txt)
          gh release create "v$version" release-assets/* --target "$GITHUB_SHA" --prerelease --title "Hush v$version — Native Windows Preview" --notes-file packaging/windows/release-notes.md
