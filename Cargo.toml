[workspace]
members = ["native"]
resolver = "2"
exclude = ["vendor/eframe"]

[patch.crates-io]
eframe = { path = "vendor/eframe" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false
